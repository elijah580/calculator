<!DOCTYPE html>
<html lang="en-US">

<head>
  <title>Calculator</title>
  <link href="css/bootstrap.css" rel="stylesheet" type="text/css">
  <link href="css/style.css" rel="stylesheet" type="text/css">
  <script src="js/script.js"></script>
</head>

<body>
  <div class="container">
    <div class="calc">
      <h1>Calculator</h1>
      <input readonly id="input1" value="0" class="screen" type="text">

      <div class="keys">
        <button class="fn" id="sin">sin</button>
        <button class="fn" id="cos">cos</button>
        <button class="fn" id="tan">tan</button>
        <button class="fn" id="sqrt">√</button>

        <button class="ac" id="clear">ac</button>
        <button class="fn" id="open">(</button>
        <button class="fn" id="close">)</button>
        <button class="op" id="divide">÷</button>

        <button id="seven">7</button>
        <button id="eight">8</button>
        <button id="nine">9</button>
        <button class="op" id="multiply">×</button>

        <button id="four">4</button>
        <button id="five">5</button>
        <button id="six">6</button>
        <button class="op" id="subtract">−</button>

        <button id="one">1</button>
        <button id="two">2</button>
        <button id="three">3</button>
        <button class="op" id="add">+</button>

        <button id="zero">0</button>
        <button id="dot">.</button>
        <button class="fn" id="delete">⌫</button>
        <button class="eq" id="eq">=</button>
      </div>
    </div>
  </div>
</body>

</html>
